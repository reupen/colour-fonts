name: Lint and build

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: 0 4 * * WED
  push:
    branches:
      - main
      - test/*

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Lint
        run: uv run lefthook run pre-commit --fail-on-changes

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build
        run: uv run twemoji/build.py

      - name: Upload artefact (twemoji-colrv0.ttf)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: twemoji/dist/twemoji-colrv0.ttf
          archive: false

      - name: Upload artefact (twemoji-colrv0--no-keycap.ttf)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: twemoji/dist/twemoji-colrv0--no-keycap.ttf
          archive: false
